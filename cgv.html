<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conditions générales de vente — NoelWish</title><meta name="description" content="Conditions de vente NoelWish"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#35171a;font-family:'DM Sans',sans-serif;line-height:1.7}header{background:#720d1b;color:#ffe09a;padding:18px clamp(20px,6vw,80px);display:flex;align-items:center;justify-content:space-between;gap:18px}header a{color:inherit;text-decoration:none;font-family:'Playfair Display',serif;font-size:26px}select{font:inherit;background:#fff9ef;color:#35171a;border:1px solid #ffe09a;border-radius:999px;padding:8px 12px;font-weight:700}main{max-width:820px;margin:auto;padding:55px 22px 90px}h1,h2{font-family:'Playfair Display',serif;color:#7b0d1b}h1{font-size:clamp(38px,6vw,60px);line-height:1.08}h2{margin-top:38px;line-height:1.25}a{color:#8d1523}.note{background:#fff0cc;border-left:4px solid #cf9c34;padding:14px 18px;border-radius:8px}.muted{color:#795e59}footer{border-top:1px solid #dbc9aa;padding:24px;text-align:center}@media(max-width:520px){header{padding:16px 18px}header a{font-size:22px}}</style></head><body><header><a href="/">✦ NoelWish</a><select id="language" aria-label="Language"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option><option value="de">DE</option></select></header><main id="content"></main><footer id="footer"></footer><script>const CONTENT={"fr":{"title":"Conditions générales de vente","updated":"Dernière mise à jour : 24 septembre 2026","back":"Retour à NoelWish","note":"En passant commande, le client reconnaît avoir pris connaissance des présentes conditions. Elles n’excluent ni ne limitent les droits et garanties qui ne peuvent pas être écartés par la loi applicable, notamment l’Australian Consumer Law.","sections":[["1. Vendeur","\u003cp>NoelWish est exploité sous un Business Name enregistré en Australie — ABN 88 491 956 226. Contact : \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["2. Produits et services","\u003cp>NoelWish propose des lettres numériques personnalisées, des surprises et coffrets physiques personnalisés, ainsi que des contributions solidaires destinées à financer des cadeaux.\u003c/p>\u003cp>Les caractéristiques, prix et frais applicables sont présentés avant paiement. Les visuels sont illustratifs : le contenu exact d’un coffret peut varier selon les disponibilités, le pays et la personnalisation, avec une valeur et un esprit comparables à l’offre choisie.\u003c/p>"],["3. Prix et devises","\u003cp>Les prix sont affichés dans la devise du marché sélectionné. Le total, frais de livraison inclus lorsqu’ils s’appliquent, est indiqué avant paiement. Les éventuels frais bancaires de conversion restent à la charge du client.\u003c/p>"],["4. Commande et paiement","\u003cp>Le client doit vérifier les noms, messages, e-mails, dates et adresses fournis. La commande est confirmée après acceptation du paiement sécurisé. NoelWish peut refuser ou annuler une commande en cas de paiement non autorisé, d’informations erronées, de contenu illicite ou d’impossibilité raisonnable d’exécution. Les éléments non fournis sont alors remboursés.\u003c/p>"],["5. Lettres numériques personnalisées","\u003cp>La lettre est envoyée immédiatement ou à la date et à l’heure choisies, selon le fuseau horaire indiqué. Le client doit aussi vérifier les courriers indésirables et l’onglet Promotions. Une erreur d’adresse fournie par le client peut empêcher la livraison.\u003c/p>\u003cp>La personnalisation pouvant commencer dès le paiement, une annulation pour simple changement d’avis n’est plus garantie après le début de la préparation ou de l’envoi. Les droits légaux en cas de service défectueux, non conforme ou non fourni restent applicables.\u003c/p>"],["6. Coffrets cadeaux et livraison","\u003cp>Les coffrets sont personnalisés et préparés sous trois jours ouvrés avant expédition. Les délais de transport sont des estimations et varient selon la destination, les transporteurs, les douanes et les périodes de forte activité. Un suivi est communiqué lorsqu’il est disponible.\u003c/p>\u003cp>Les droits de douane, taxes d’importation ou frais locaux non indiqués lors du paiement restent à la charge du destinataire. Les frais d’une réexpédition due à une adresse incorrecte, incomplète ou à un colis non réclamé peuvent être facturés.\u003c/p>"],["7. Annulation, retours et changement d’avis","\u003cp>Écrivez au plus vite à \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a> pour demander une modification ou une annulation. Elle peut être acceptée tant que la personnalisation, la préparation ou l’expédition n’a pas commencé. Les produits personnalisés ne sont normalement pas repris pour un simple changement d’avis.\u003c/p>\u003cp>Si un produit arrive endommagé, incorrect ou sensiblement différent, contactez NoelWish avec une description et, si possible, des photos. Selon les droits applicables, une correction, un remplacement, une nouvelle exécution ou un remboursement sera proposé. Aucun retour ne doit être envoyé sans instructions.\u003c/p>"],["8. Remboursements","\u003cp>Tout remboursement accordé est effectué sur le moyen de paiement d’origine. Son délai d’apparition dépend de la banque ou de l’émetteur de la carte. Les garanties légales obligatoires restent pleinement applicables.\u003c/p>"],["9. Contributions solidaires","\u003cp>Les contributions participent au financement de cadeaux organisés par NoelWish. Elles ne constituent pas un achat pour le contributeur et ne donnent pas droit à un reçu fiscal. Une contribution déjà affectée ou utilisée n’est normalement pas remboursée pour simple changement d’avis. Si l’action annoncée devient impossible, NoelWish pourra financer une action comparable ou proposer un remboursement.\u003c/p>"],["10. Responsabilité","\u003cp>NoelWish met en œuvre des moyens raisonnables pour exécuter les commandes. Dans les limites permises par la loi, NoelWish n’est pas responsable des retards causés par des informations incorrectes, un transporteur, les douanes, un service externe ou un événement indépendant de sa volonté. Aucune responsabilité légalement non excluable n’est limitée.\u003c/p>"],["11. Propriété intellectuelle et contenus","\u003cp>Le site, les textes, illustrations et marques sont protégés. Le client garantit pouvoir utiliser les noms, messages et contenus transmis et autorise leur traitement uniquement pour produire, livrer et suivre la commande.\u003c/p>"],["12. Réclamations et droit applicable","\u003cp>Les réclamations peuvent être adressées à \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>. NoelWish cherchera une solution amiable.\u003c/p>\u003cp>Les présentes conditions sont régies par les lois applicables en Australie, sans priver le client des protections impératives de son pays de résidence.\u003c/p>"]]},"en":{"title":"Terms and Conditions of Sale","updated":"Last updated: 24 September 2026","back":"Back to NoelWish","note":"By placing an order, the customer acknowledges these terms. They do not exclude or limit any rights or guarantees that cannot lawfully be excluded, including under the Australian Consumer Law.","sections":[["1. Seller","\u003cp>NoelWish operates under a Business Name registered in Australia — ABN 88 491 956 226. Contact: \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["2. Products and services","\u003cp>NoelWish offers personalised digital letters, personalised physical surprises and gift boxes, and solidarity contributions used to fund gifts.\u003c/p>\u003cp>Key features, prices and applicable fees are shown before payment. Box images are illustrative: exact contents may vary with availability, destination and personalisation while retaining comparable value and spirit.\u003c/p>"],["3. Prices and currencies","\u003cp>Prices are shown in the selected market’s currency. The total, including delivery where applicable, is displayed before payment. Bank conversion or issuer fees remain the customer’s responsibility.\u003c/p>"],["4. Orders and payment","\u003cp>The customer must check all names, messages, email addresses, dates and delivery addresses. An order is confirmed after secure payment is accepted. NoelWish may refuse or cancel orders involving unauthorised payment, clearly incorrect information, unlawful content or reasonable inability to fulfil. Amounts for unprovided items will be refunded.\u003c/p>"],["5. Personalised digital letters","\u003cp>Letters are sent immediately or at the chosen date and time using the stated time zone. Customers should check spam and Promotions folders. An incorrect customer-supplied address may prevent delivery.\u003c/p>\u003cp>As personalisation may begin immediately after payment, cancellation for change of mind is not guaranteed once preparation or sending starts. Statutory rights for defective, non-conforming or unprovided services remain unaffected.\u003c/p>"],["6. Gift boxes and delivery","\u003cp>Boxes are personalised and prepared within three business days before dispatch. Transit times are estimates and vary by destination, carrier, customs and peak periods. Tracking is provided when available.\u003c/p>\u003cp>Customs duties, import taxes or local fees not shown at checkout are payable by the recipient. Re-shipping caused by an incorrect or incomplete address or an unclaimed parcel may be charged.\u003c/p>"],["7. Cancellation, returns and change of mind","\u003cp>Contact \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a> as soon as possible to request a change or cancellation. It may be accepted before personalisation, preparation or dispatch begins. Personalised products are not normally returnable for change of mind.\u003c/p>\u003cp>If an item arrives damaged, incorrect or materially different, contact NoelWish with details and, where possible, photos. Depending on applicable rights, NoelWish will offer correction, replacement, re-performance or refund. Do not return items without instructions.\u003c/p>"],["8. Refunds","\u003cp>Approved refunds are made to the original payment method. Posting time depends on the bank or card issuer. Mandatory consumer guarantees remain unaffected.\u003c/p>"],["9. Solidarity contributions","\u003cp>Contributions help fund gifts organised by NoelWish. They are not a purchase for the contributor and are not tax-deductible. An allocated or used contribution is not normally refundable for change of mind. If the announced action cannot proceed, NoelWish may fund a comparable action or offer a refund.\u003c/p>"],["10. Liability","\u003cp>NoelWish uses reasonable efforts to fulfil orders. To the extent permitted by law, it is not liable for delays caused by incorrect customer information, carriers, customs, external outages or events beyond its control. Liability that cannot lawfully be excluded remains unaffected.\u003c/p>"],["11. Intellectual property and submitted content","\u003cp>The site, text, illustrations and brands are protected. Customers confirm they may use submitted names, messages and content and authorise processing solely to produce, deliver and support the order.\u003c/p>"],["12. Complaints and governing law","\u003cp>Complaints may be sent to \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>. NoelWish will first seek an amicable solution.\u003c/p>\u003cp>These terms are governed by applicable Australian law without removing mandatory protections available in the customer’s country of residence.\u003c/p>"]]},"es":{"title":"Condiciones generales de venta","updated":"Última actualización: 24 de septiembre de 2026","back":"Volver a NoelWish","note":"Al realizar un pedido, el cliente acepta estas condiciones. No excluyen ni limitan los derechos o garantías que la ley no permite excluir, incluida la Australian Consumer Law.","sections":[["1. Vendedor","\u003cp>NoelWish opera bajo un Business Name registrado en Australia — ABN 88 491 956 226. Contacto: \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["2. Productos y servicios","\u003cp>NoelWish ofrece cartas digitales personalizadas, sorpresas y cajas físicas personalizadas, y contribuciones solidarias para financiar regalos.\u003c/p>\u003cp>Las características, precios y gastos aplicables se muestran antes del pago. Las imágenes son ilustrativas: el contenido exacto puede variar según disponibilidad, destino y personalización, manteniendo un valor y espíritu comparables.\u003c/p>"],["3. Precios y divisas","\u003cp>Los precios se muestran en la divisa del mercado seleccionado. El total, incluido el envío cuando corresponda, aparece antes del pago. Las comisiones bancarias o de conversión corren por cuenta del cliente.\u003c/p>"],["4. Pedido y pago","\u003cp>El cliente debe comprobar nombres, mensajes, correos, fechas y direcciones. El pedido se confirma tras aceptar el pago seguro. NoelWish puede rechazar o cancelar pedidos por pago no autorizado, datos erróneos, contenido ilegal o imposibilidad razonable de ejecución. Se reembolsarán los elementos no suministrados.\u003c/p>"],["5. Cartas digitales personalizadas","\u003cp>La carta se envía inmediatamente o en la fecha y hora elegidas, según la zona horaria indicada. Deben revisarse Spam y Promociones. Una dirección incorrecta proporcionada por el cliente puede impedir la entrega.\u003c/p>\u003cp>Como la personalización puede empezar tras el pago, no se garantiza la cancelación por cambio de opinión una vez iniciada la preparación o el envío. Se mantienen los derechos legales por servicios defectuosos, no conformes o no prestados.\u003c/p>"],["6. Cajas regalo y entrega","\u003cp>Las cajas se personalizan y preparan en tres días laborables antes del envío. Los plazos de transporte son estimados y dependen del destino, transportista, aduanas y temporada. Se facilita seguimiento cuando está disponible.\u003c/p>\u003cp>Los aranceles, impuestos de importación o gastos locales no mostrados al pagar corresponden al destinatario. Puede cobrarse un nuevo envío por dirección incorrecta o incompleta o paquete no reclamado.\u003c/p>"],["7. Cancelación, devoluciones y cambio de opinión","\u003cp>Escribe cuanto antes a \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>. La cancelación puede aceptarse antes de iniciar personalización, preparación o envío. Los productos personalizados normalmente no se devuelven por simple cambio de opinión.\u003c/p>\u003cp>Si un producto llega dañado, incorrecto o muy diferente, contacta con NoelWish con una descripción y fotos si es posible. Según los derechos aplicables, se ofrecerá corrección, sustitución, nueva ejecución o reembolso. No envíes devoluciones sin instrucciones.\u003c/p>"],["8. Reembolsos","\u003cp>Los reembolsos aprobados se realizan al método de pago original. El plazo depende del banco o emisor. Las garantías legales obligatorias permanecen vigentes.\u003c/p>"],["9. Contribuciones solidarias","\u003cp>Las contribuciones financian regalos organizados por NoelWish. No son una compra para el contribuyente ni generan recibo fiscal. Una contribución ya asignada o utilizada normalmente no se reembolsa por cambio de opinión. Si la acción no puede realizarse, NoelWish podrá financiar una acción comparable u ofrecer reembolso.\u003c/p>"],["10. Responsabilidad","\u003cp>NoelWish aplica medios razonables para ejecutar los pedidos. En la medida permitida por la ley, no responde de retrasos causados por datos incorrectos, transportistas, aduanas, servicios externos o hechos fuera de su control. No se limita ninguna responsabilidad que legalmente no pueda excluirse.\u003c/p>"],["11. Propiedad intelectual y contenidos","\u003cp>El sitio, textos, ilustraciones y marcas están protegidos. El cliente garantiza el derecho a usar los nombres, mensajes y contenidos enviados y autoriza su tratamiento solo para producir, entregar y seguir el pedido.\u003c/p>"],["12. Reclamaciones y legislación","\u003cp>Las reclamaciones pueden enviarse a \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>. NoelWish buscará primero una solución amistosa.\u003c/p>\u003cp>Estas condiciones se rigen por la legislación australiana aplicable sin eliminar las protecciones obligatorias del país de residencia del cliente.\u003c/p>"]]},"pt":{"title":"Termos e condições de venda","updated":"Última atualização: 24 de setembro de 2026","back":"Voltar à NoelWish","note":"Ao efetuar uma encomenda, o cliente aceita estes termos. Eles não excluem nem limitam direitos ou garantias que não possam ser legalmente excluídos, incluindo os previstos na Australian Consumer Law.","sections":[["1. Vendedor","\u003cp>A NoelWish opera sob um Business Name registado na Austrália — ABN 88 491 956 226. Contacto: \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["2. Produtos e serviços","\u003cp>A NoelWish oferece cartas digitais personalizadas, surpresas e caixas físicas personalizadas e contribuições solidárias para financiar presentes.\u003c/p>\u003cp>As características, preços e custos aplicáveis são apresentados antes do pagamento. As imagens são ilustrativas: o conteúdo pode variar conforme disponibilidade, destino e personalização, mantendo valor e espírito comparáveis.\u003c/p>"],["3. Preços e moedas","\u003cp>Os preços são exibidos na moeda do mercado selecionado. O total, incluindo entrega quando aplicável, é mostrado antes do pagamento. Taxas bancárias ou de conversão ficam a cargo do cliente.\u003c/p>"],["4. Encomenda e pagamento","\u003cp>O cliente deve verificar nomes, mensagens, emails, datas e endereços. A encomenda é confirmada após aceitação do pagamento seguro. A NoelWish pode recusar ou cancelar pedidos com pagamento não autorizado, dados incorretos, conteúdo ilegal ou impossibilidade razoável de execução. Os itens não fornecidos serão reembolsados.\u003c/p>"],["5. Cartas digitais personalizadas","\u003cp>A carta é enviada imediatamente ou na data e hora escolhidas, segundo o fuso indicado. O cliente deve verificar Spam e Promoções. Um endereço errado fornecido pelo cliente pode impedir a entrega.\u003c/p>\u003cp>Como a personalização pode começar logo após o pagamento, o cancelamento por mudança de ideia não é garantido após o início da preparação ou envio. Mantêm-se os direitos legais por serviços defeituosos, não conformes ou não prestados.\u003c/p>"],["6. Caixas presente e entrega","\u003cp>As caixas são personalizadas e preparadas em três dias úteis antes do envio. Os prazos de transporte são estimativas e variam conforme destino, transportadora, alfândega e época. O rastreamento é fornecido quando disponível.\u003c/p>\u003cp>Direitos aduaneiros, impostos de importação ou taxas locais não apresentados no pagamento ficam a cargo do destinatário. Um novo envio devido a endereço incorreto ou incompleto ou encomenda não reclamada pode ser cobrado.\u003c/p>"],["7. Cancelamento, devoluções e mudança de ideia","\u003cp>Contacte \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a> o mais rapidamente possível. O cancelamento pode ser aceite antes do início da personalização, preparação ou envio. Produtos personalizados normalmente não são devolvidos por simples mudança de ideia.\u003c/p>\u003cp>Se um produto chegar danificado, incorreto ou substancialmente diferente, contacte a NoelWish com descrição e fotos, se possível. Conforme os direitos aplicáveis, será oferecida correção, substituição, nova execução ou reembolso. Não envie devoluções sem instruções.\u003c/p>"],["8. Reembolsos","\u003cp>Os reembolsos aprovados são feitos para o método de pagamento original. O prazo depende do banco ou emissor. As garantias legais obrigatórias permanecem aplicáveis.\u003c/p>"],["9. Contribuições solidárias","\u003cp>As contribuições financiam presentes organizados pela NoelWish. Não são uma compra para o contribuinte e não dão direito a recibo fiscal. Uma contribuição já atribuída ou utilizada normalmente não é reembolsada por mudança de ideia. Se a ação anunciada não puder ocorrer, a NoelWish poderá financiar ação comparável ou oferecer reembolso.\u003c/p>"],["10. Responsabilidade","\u003cp>A NoelWish usa meios razoáveis para executar as encomendas. Nos limites legais, não responde por atrasos causados por dados incorretos, transportadoras, alfândega, serviços externos ou eventos fora do seu controlo. Nenhuma responsabilidade que não possa ser legalmente excluída é limitada.\u003c/p>"],["11. Propriedade intelectual e conteúdos","\u003cp>O site, textos, ilustrações e marcas estão protegidos. O cliente garante poder utilizar nomes, mensagens e conteúdos enviados e autoriza o tratamento apenas para produzir, entregar e acompanhar a encomenda.\u003c/p>"],["12. Reclamações e lei aplicável","\u003cp>As reclamações podem ser enviadas para \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>. A NoelWish procurará primeiro uma solução amigável.\u003c/p>\u003cp>Estes termos são regidos pela legislação australiana aplicável sem retirar as proteções obrigatórias do país de residência do cliente.\u003c/p>"]]},"de":{"title":"Allgemeine Verkaufsbedingungen","updated":"Letzte Aktualisierung: 24. September 2026","back":"Zurück zu NoelWish","note":"Mit der Bestellung erkennt der Kunde diese Bedingungen an. Rechte und Garantien, die gesetzlich nicht ausgeschlossen werden dürfen, insbesondere nach dem Australian Consumer Law, bleiben unberührt.","sections":[["1. Verkäufer","\u003cp>NoelWish wird unter einem in Australien registrierten Business Name betrieben — ABN 88 491 956 226. Kontakt: \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["2. Produkte und Dienstleistungen","\u003cp>NoelWish bietet personalisierte digitale Briefe, personalisierte physische Überraschungen und Geschenkboxen sowie solidarische Beiträge zur Finanzierung von Geschenken.\u003c/p>\u003cp>Eigenschaften, Preise und Kosten werden vor der Zahlung angezeigt. Abbildungen sind beispielhaft: Der genaue Inhalt kann je nach Verfügbarkeit, Zielort und Personalisierung variieren, bleibt jedoch in Wert und Charakter vergleichbar.\u003c/p>"],["3. Preise und Währungen","\u003cp>Preise werden in der Währung des gewählten Marktes angezeigt. Der Gesamtbetrag einschließlich anwendbarer Versandkosten erscheint vor der Zahlung. Bank- oder Umrechnungsgebühren trägt der Kunde.\u003c/p>"],["4. Bestellung und Zahlung","\u003cp>Der Kunde muss Namen, Nachrichten, E-Mail-Adressen, Termine und Lieferadressen prüfen. Die Bestellung wird nach Annahme der sicheren Zahlung bestätigt. NoelWish kann Bestellungen bei nicht autorisierter Zahlung, falschen Angaben, rechtswidrigen Inhalten oder angemessener Unmöglichkeit der Ausführung ablehnen oder stornieren. Nicht gelieferte Bestandteile werden erstattet.\u003c/p>"],["5. Personalisierte digitale Briefe","\u003cp>Der Brief wird sofort oder zum gewählten Datum und Zeitpunkt gemäß angegebener Zeitzone versandt. Spam- und Werbeordner sind zu prüfen. Eine falsch angegebene Adresse kann die Zustellung verhindern.\u003c/p>\u003cp>Da die Personalisierung sofort beginnen kann, ist eine Stornierung wegen Meinungsänderung nach Beginn der Vorbereitung oder des Versands nicht garantiert. Gesetzliche Rechte bei mangelhaften, nicht vertragsgemäßen oder nicht erbrachten Leistungen bleiben bestehen.\u003c/p>"],["6. Geschenkboxen und Lieferung","\u003cp>Boxen werden personalisiert und innerhalb von drei Werktagen vor dem Versand vorbereitet. Transportzeiten sind Schätzungen und hängen von Zielort, Versanddienstleister, Zoll und Saison ab. Eine Sendungsverfolgung wird bereitgestellt, wenn verfügbar.\u003c/p>\u003cp>Zölle, Einfuhrsteuern oder lokale Gebühren, die beim Bezahlen nicht angezeigt werden, trägt der Empfänger. Erneuter Versand aufgrund falscher oder unvollständiger Adresse oder nicht abgeholter Sendung kann berechnet werden.\u003c/p>"],["7. Stornierung, Rückgabe und Meinungsänderung","\u003cp>Schreiben Sie möglichst früh an \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>. Eine Stornierung kann vor Beginn von Personalisierung, Vorbereitung oder Versand akzeptiert werden. Personalisierte Produkte werden bei bloßer Meinungsänderung normalerweise nicht zurückgenommen.\u003c/p>\u003cp>Kommt ein Produkt beschädigt, falsch oder wesentlich abweichend an, kontaktieren Sie NoelWish mit Beschreibung und möglichst Fotos. Je nach geltenden Rechten werden Korrektur, Ersatz, erneute Leistung oder Erstattung angeboten. Rücksendungen dürfen nicht ohne Anweisung erfolgen.\u003c/p>"],["8. Erstattungen","\u003cp>Genehmigte Erstattungen erfolgen auf das ursprüngliche Zahlungsmittel. Die Dauer hängt von Bank oder Kartenanbieter ab. Zwingende gesetzliche Garantien bleiben unberührt.\u003c/p>"],["9. Solidarische Beiträge","\u003cp>Beiträge finanzieren von NoelWish organisierte Geschenke. Sie sind kein Kauf für den Beitragenden und nicht steuerlich absetzbar. Bereits zugewiesene oder verwendete Beiträge werden bei Meinungsänderung normalerweise nicht erstattet. Kann die Aktion nicht stattfinden, kann NoelWish eine vergleichbare Aktion finanzieren oder erstatten.\u003c/p>"],["10. Haftung","\u003cp>NoelWish setzt angemessene Mittel zur Auftragsausführung ein. Soweit gesetzlich zulässig, haftet NoelWish nicht für Verzögerungen durch falsche Angaben, Versanddienstleister, Zoll, externe Dienste oder Ereignisse außerhalb seiner Kontrolle. Gesetzlich nicht ausschließbare Haftung bleibt bestehen.\u003c/p>"],["11. Geistiges Eigentum und Inhalte","\u003cp>Website, Texte, Illustrationen und Marken sind geschützt. Der Kunde bestätigt das Recht zur Nutzung übermittelter Namen, Nachrichten und Inhalte und gestattet deren Verarbeitung nur zur Herstellung, Lieferung und Betreuung der Bestellung.\u003c/p>"],["12. Beschwerden und anwendbares Recht","\u003cp>Beschwerden können an \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a> gesendet werden. NoelWish bemüht sich zunächst um eine einvernehmliche Lösung.\u003c/p>\u003cp>Diese Bedingungen unterliegen dem anwendbaren australischen Recht, ohne zwingende Schutzrechte im Wohnsitzland des Kunden einzuschränken.\u003c/p>"]]}};const supported=['fr','en','es','pt','de'];let lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('noelwish_lang')||navigator.language.slice(0,2);if(!supported.includes(lang))lang='en';const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const c=CONTENT[lang]||CONTENT.en;document.documentElement.lang=lang;document.title=c.title+' — NoelWish';document.getElementById('language').value=lang;document.getElementById('content').innerHTML='<p class="muted">'+esc(c.updated)+'</p><h1>'+esc(c.title)+'</h1>'+(c.note?'<div class="note">'+c.note+'</div>':'')+c.sections.map(s=>'<h2>'+esc(s[0])+'</h2><div>'+s[1]+'</div>').join('');document.getElementById('footer').innerHTML='<a href="/">'+esc(c.back)+'</a> · <a href="mailto:magic@noelwish.com">magic@noelwish.com</a>'}document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('noelwish_lang',lang);const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState({},'',u);render()};render();</script></body></html>
