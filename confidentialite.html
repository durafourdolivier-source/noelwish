<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Politique de confidentialité — NoelWish</title><meta name="description" content="Protection des données NoelWish"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#35171a;font-family:'DM Sans',sans-serif;line-height:1.7}header{background:#720d1b;color:#ffe09a;padding:18px clamp(20px,6vw,80px);display:flex;align-items:center;justify-content:space-between;gap:18px}header a{color:inherit;text-decoration:none;font-family:'Playfair Display',serif;font-size:26px}select{font:inherit;background:#fff9ef;color:#35171a;border:1px solid #ffe09a;border-radius:999px;padding:8px 12px;font-weight:700}main{max-width:820px;margin:auto;padding:55px 22px 90px}h1,h2{font-family:'Playfair Display',serif;color:#7b0d1b}h1{font-size:clamp(38px,6vw,60px);line-height:1.08}h2{margin-top:38px;line-height:1.25}a{color:#8d1523}.note{background:#fff0cc;border-left:4px solid #cf9c34;padding:14px 18px;border-radius:8px}.muted{color:#795e59}footer{border-top:1px solid #dbc9aa;padding:24px;text-align:center}@media(max-width:520px){header{padding:16px 18px}header a{font-size:22px}}</style></head><body><header><a href="/">✦ NoelWish</a><select id="language" aria-label="Language"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option><option value="de">DE</option></select></header><main id="content"></main><footer id="footer"></footer><script>const CONTENT={"fr":{"title":"Politique de confidentialité","updated":"Dernière mise à jour : 24 septembre 2026","back":"Retour à NoelWish","sections":[["Données collectées","\u003cp>NoelWish traite les informations nécessaires à la création et à l’envoi des surprises : coordonnées de l’acheteur, prénom et e-mail du destinataire, message personnel, préférences, adresse de livraison et informations techniques nécessaires au site.\u003c/p>"],["Pourquoi ces données sont utilisées","\u003cp>Elles servent à exécuter la commande, envoyer les e-mails demandés, préparer et livrer les produits, assurer le support et prévenir les abus. Le paiement est traité directement par Stripe.\u003c/p>"],["Prestataires","\u003cp>Les données nécessaires peuvent être transmises à Stripe pour le paiement, Resend pour les e-mails, Vercel pour l’hébergement et aux prestataires nécessaires à la livraison. Elles ne sont pas vendues.\u003c/p>"],["Durée de conservation","\u003cp>Les données de commande sont conservées pendant la durée nécessaire à l’exécution, au support et aux obligations comptables ou légales. Les vœux enregistrés uniquement dans le navigateur peuvent être supprimés en effaçant les données locales.\u003c/p>"],["Vos droits","\u003cp>Selon la réglementation applicable, vous pouvez demander l’accès, la rectification ou la suppression de vos données et vous opposer à certains traitements. Écrivez à \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["Mineurs","\u003cp>Un adulte doit effectuer les achats et ne transmettre que les informations nécessaires concernant un enfant.\u003c/p>"]]},"en":{"title":"Privacy policy","updated":"Last updated: 24 September 2026","back":"Back to NoelWish","sections":[["Data collected","\u003cp>NoelWish processes information needed to create and deliver surprises: buyer contact details, recipient name and email, personal message, preferences, shipping address and technical data needed to operate the site.\u003c/p>"],["Why we use it","\u003cp>We use it to fulfil orders, send requested emails, prepare and deliver products, provide support and prevent abuse. Payment details are processed directly by Stripe.\u003c/p>"],["Service providers","\u003cp>Necessary data may be shared with Stripe for payments, Resend for emails, Vercel for hosting and providers needed for delivery. It is not sold.\u003c/p>"],["Retention","\u003cp>Order data is retained as needed for fulfilment, support and accounting or legal obligations. Wishes stored only in the browser can be removed by clearing the site’s local data.\u003c/p>"],["Your rights","\u003cp>Depending on applicable law, you may request access, correction or deletion of your data and object to certain processing. Contact \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["Children","\u003cp>An adult must make purchases and provide only the information necessary about a child.\u003c/p>"]]},"es":{"title":"Política de privacidad","updated":"Última actualización: 24 de septiembre de 2026","back":"Volver a NoelWish","sections":[["Datos recogidos","\u003cp>NoelWish trata la información necesaria para crear y enviar sorpresas: datos del comprador, nombre y correo del destinatario, mensaje, preferencias, dirección de entrega y datos técnicos del sitio.\u003c/p>"],["Uso de los datos","\u003cp>Se utilizan para ejecutar el pedido, enviar correos solicitados, preparar y entregar productos, prestar soporte y prevenir abusos. Stripe procesa directamente el pago.\u003c/p>"],["Proveedores","\u003cp>Los datos necesarios pueden compartirse con Stripe para pagos, Resend para correos, Vercel para alojamiento y proveedores necesarios para la entrega. No se venden.\u003c/p>"],["Conservación","\u003cp>Los datos del pedido se conservan durante el tiempo necesario para ejecución, soporte y obligaciones contables o legales. Los deseos guardados solo en el navegador pueden borrarse eliminando los datos locales.\u003c/p>"],["Tus derechos","\u003cp>Según la ley aplicable, puedes solicitar acceso, rectificación o supresión y oponerte a determinados tratamientos. Contacta con \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["Menores","\u003cp>Un adulto debe realizar las compras y proporcionar únicamente la información necesaria sobre un menor.\u003c/p>"]]},"pt":{"title":"Política de privacidade","updated":"Última atualização: 24 de setembro de 2026","back":"Voltar à NoelWish","sections":[["Dados recolhidos","\u003cp>A NoelWish trata as informações necessárias para criar e enviar surpresas: contactos do comprador, nome e email do destinatário, mensagem, preferências, endereço de entrega e dados técnicos necessários ao site.\u003c/p>"],["Utilização dos dados","\u003cp>São usados para executar a encomenda, enviar emails, preparar e entregar produtos, prestar apoio e prevenir abusos. O pagamento é processado diretamente pela Stripe.\u003c/p>"],["Prestadores","\u003cp>Os dados necessários podem ser partilhados com a Stripe para pagamentos, Resend para emails, Vercel para alojamento e prestadores necessários à entrega. Não são vendidos.\u003c/p>"],["Conservação","\u003cp>Os dados da encomenda são conservados durante o período necessário à execução, apoio e obrigações contabilísticas ou legais. Os desejos guardados apenas no navegador podem ser removidos apagando os dados locais.\u003c/p>"],["Os seus direitos","\u003cp>Conforme a lei aplicável, pode pedir acesso, correção ou eliminação e opor-se a certos tratamentos. Contacte \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["Menores","\u003cp>Um adulto deve efetuar as compras e fornecer apenas as informações necessárias sobre uma criança.\u003c/p>"]]},"de":{"title":"Datenschutzerklärung","updated":"Letzte Aktualisierung: 24. September 2026","back":"Zurück zu NoelWish","sections":[["Erhobene Daten","\u003cp>NoelWish verarbeitet Daten, die zur Erstellung und Lieferung von Überraschungen erforderlich sind: Kontaktdaten des Käufers, Name und E-Mail des Empfängers, Nachricht, Vorlieben, Lieferadresse und technische Website-Daten.\u003c/p>"],["Zweck der Verarbeitung","\u003cp>Die Daten dienen der Auftragsabwicklung, dem Versand gewünschter E-Mails, der Vorbereitung und Lieferung, dem Support und der Missbrauchsprävention. Zahlungsdaten werden direkt von Stripe verarbeitet.\u003c/p>"],["Dienstleister","\u003cp>Notwendige Daten können an Stripe für Zahlungen, Resend für E-Mails, Vercel für Hosting und erforderliche Lieferdienstleister übermittelt werden. Sie werden nicht verkauft.\u003c/p>"],["Speicherdauer","\u003cp>Bestelldaten werden so lange gespeichert, wie es für Abwicklung, Support und rechtliche oder buchhalterische Pflichten erforderlich ist. Nur im Browser gespeicherte Wünsche können durch Löschen der lokalen Website-Daten entfernt werden.\u003c/p>"],["Ihre Rechte","\u003cp>Je nach anwendbarem Recht können Sie Auskunft, Berichtigung oder Löschung verlangen und bestimmten Verarbeitungen widersprechen. Kontakt: \u003ca href=\"mailto:magic@noelwish.com\">magic@noelwish.com\u003c/a>.\u003c/p>"],["Minderjährige","\u003cp>Käufe müssen von einem Erwachsenen getätigt werden; über Kinder dürfen nur notwendige Informationen übermittelt werden.\u003c/p>"]]}};const supported=['fr','en','es','pt','de'];let lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('noelwish_lang')||navigator.language.slice(0,2);if(!supported.includes(lang))lang='en';const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const c=CONTENT[lang]||CONTENT.en;document.documentElement.lang=lang;document.title=c.title+' — NoelWish';document.getElementById('language').value=lang;document.getElementById('content').innerHTML='<p class="muted">'+esc(c.updated)+'</p><h1>'+esc(c.title)+'</h1>'+(c.note?'<div class="note">'+c.note+'</div>':'')+c.sections.map(s=>'<h2>'+esc(s[0])+'</h2><div>'+s[1]+'</div>').join('');document.getElementById('footer').innerHTML='<a href="/">'+esc(c.back)+'</a> · <a href="mailto:magic@noelwish.com">magic@noelwish.com</a>'}document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('noelwish_lang',lang);const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState({},'',u);render()};render();</script></body></html>
